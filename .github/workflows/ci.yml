name: Slotfolio CI

on:
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  probe-endorphina:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect official Endorphina nested assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/endorphina-materials /tmp/endorphina-sheets
          for slug in hell-hot-100 joker-stoker lucky-streak-1 3-coin-towers; do
            echo "===== ${slug} ====="
            outer="/tmp/endorphina-materials/${slug}.zip"
            curl --fail --location --silent --show-error --retry 2 \
              --user-agent 'Mozilla/5.0 SlotfolioAssetResearch/1.0' \
              "https://endorphina.com/games/download-materials?slug=${slug}" \
              --output "$outer"

            sheet="$(unzip -Z1 "$outer" | grep -E '^game_sheet_.*\.(png|jpe?g)$' | head -n 1)"
            inner_name="$(unzip -Z1 "$outer" | grep -E '^game_.*\.zip$' | head -n 1)"
            echo "sheet: $sheet"
            echo "inner: $inner_name"

            ext="${sheet##*.}"
            unzip -p "$outer" "$sheet" > "/tmp/endorphina-sheets/${slug}.${ext}"
            unzip -p "$outer" "$inner_name" > "/tmp/endorphina-materials/${slug}-inner.zip"

            echo "-- image candidates in inner archive --"
            unzip -l "/tmp/endorphina-materials/${slug}-inner.zip" \
              | grep -Ei '\.(png|jpe?g|webp)[[:space:]]*$' \
              | sed -n '1,220p' || true
          done

      - name: Upload Endorphina game sheets
        uses: actions/upload-artifact@v4
        with:
          name: endorphina-game-sheets
          path: /tmp/endorphina-sheets
          if-no-files-found: error
          retention-days: 1
