name: Deploy Slotfolio to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cache localized slot images
        uses: actions/cache@v4
        with:
          path: |
            .asset-cache/slot-images
            public/images/slots
          key: slot-images-${{ runner.os }}-${{ hashFiles('docs/image-sources.json', 'docs/image-sources-v128.json', 'scripts/localize-slot-images.mjs') }}
          restore-keys: |
            slot-images-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Localize slot artwork for preview
        run: npm run assets:localize -- --soft

      - name: Build static site
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          export NEXT_PUBLIC_BASE_PATH="/${REPO_NAME}"
          export NEXT_PUBLIC_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"
          export NEXT_PUBLIC_INDEXABLE="${{ vars.NEXT_PUBLIC_INDEXABLE }}"

          # GitHub Pages is static hosting. The server-side affiliate redirect
          # remains in the source project, but is omitted from this preview build.
          rm -f 'src/app/go/[operator]/route.ts'

          # Preview deployment is intentionally tolerant of temporary provider-CDN
          # artwork failures. The project's regular npm run build remains strict.
          npx next build
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
