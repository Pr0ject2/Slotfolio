name: Harvest 3 Oaks Catalog

on:
  push:
    branches: ["fix/v129-unique-100"]
    paths:
      - "scripts/harvest-3oaks.mjs"
      - ".github/workflows/harvest-3oaks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "catalog-3oaks-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Harvest 3 Oaks official catalog
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/harvest-3oaks.mjs

      - name: Upload 3 Oaks catalog
        uses: actions/upload-artifact@v4
        with:
          name: slot-catalog-3oaks
          path: artifacts/catalog-3oaks*.json
          if-no-files-found: error
          retention-days: 1
