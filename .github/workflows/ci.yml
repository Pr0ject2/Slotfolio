name: Slotfolio CI

on:
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  probe-endorphina:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Extract official Endorphina screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/endorphina-materials /tmp/endorphina-screens
          for slug in hell-hot-100 joker-stoker lucky-streak-1 3-coin-towers; do
            echo "===== ${slug} ====="
            outer="/tmp/endorphina-materials/${slug}.zip"
            curl --fail --location --silent --show-error --retry 2 \
              --user-agent 'Mozilla/5.0 SlotfolioAssetResearch/1.0' \
              "https://endorphina.com/games/download-materials?slug=${slug}" \
              --output "$outer"
            inner_name="$(unzip -Z1 "$outer" | grep -E '^game_.*\.zip$' | head -n 1)"
            inner="/tmp/endorphina-materials/${slug}-inner.zip"
            unzip -p "$outer" "$inner_name" > "$inner"
            mkdir -p "/tmp/endorphina-screens/${slug}"
            while IFS= read -r entry; do
              case "$entry" in
                __MACOSX/*) continue ;;
              esac
              if printf '%s' "$entry" | grep -Eiq '/(Screenshots|Screens)/[^/]+\.(png|jpe?g|webp)$'; then
                base="$(basename "$entry")"
                unzip -p "$inner" "$entry" > "/tmp/endorphina-screens/${slug}/${base}"
              fi
            done < <(unzip -Z1 "$inner")
            find "/tmp/endorphina-screens/${slug}" -type f -maxdepth 1 -printf '%f %s bytes\n' | sort -V
          done

      - name: Upload Endorphina screenshots
        uses: actions/upload-artifact@v4
        with:
          name: endorphina-screenshots
          path: /tmp/endorphina-screens
          if-no-files-found: error
          retention-days: 1
