name: Enrich Slot Dossiers Batch 2

on:
  push:
    branches:
      - improve/slot-dossiers-batch-2-20260909
    paths:
      - scripts/enrich-slot-dossiers-batch2.mjs
      - .github/workflows/enrich-slot-dossiers-batch2.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/slot-dossiers-batch-2-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply dossier enrichment
        run: node scripts/enrich-slot-dossiers-batch2.mjs
      - name: Validate diff
        run: |
          git diff --check
          grep -q 'slotfolio-slot-dossier-batch2-20260909' src/lib/dossier.ts
          grep -q 'Множители 2x–500x' src/lib/dossier.ts
          grep -q 'Множитель до 128x' src/lib/dossier.ts
          grep -q 'Wheel of Multipliers до x10' src/lib/dossier.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Localize reviewed artwork where available
        run: npm run assets:localize -- --soft
      - name: Build static production site
        env:
          NEXT_PUBLIC_SITE_URL: https://example.invalid
          NEXT_PUBLIC_INDEXABLE: "false"
          NEXT_PUBLIC_BASE_PATH: ""
        run: |
          rm -f 'src/app/go/[operator]/route.ts'
          npx next build
      - name: Start static site
        run: |
          python3 -m http.server 3000 --directory out > /tmp/slotfolio-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/slotfolio-http.log
          exit 1
      - name: Run Playwright
        env:
          CHROME_PATH: /usr/bin/google-chrome
          SLOTFOLIO_STATIC_PREVIEW: "true"
        run: npm test
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/dossier.ts
          if git diff --cached --quiet; then
            echo "No production changes"
          else
            git commit -m "Enrich second slot dossier batch"
            git push origin HEAD:improve/slot-dossiers-batch-2-20260909
          fi
