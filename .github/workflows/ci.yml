name: Slotfolio CI

on:
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  probe-endorphina:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official Endorphina material archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/endorphina-materials
          for slug in hell-hot-100 joker-stoker lucky-streak-1 3-coin-towers; do
            echo "===== ${slug} ====="
            zip="/tmp/endorphina-materials/${slug}.zip"
            curl --fail --location --silent --show-error \
              --retry 2 \
              --user-agent 'Mozilla/5.0 SlotfolioAssetResearch/1.0' \
              "https://endorphina.com/games/download-materials?slug=${slug}" \
              --output "$zip"
            file "$zip"
            du -h "$zip"
            unzip -l "$zip" | sed -n '1,180p'
          done
